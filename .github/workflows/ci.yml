name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skillio
          POSTGRES_PASSWORD: skillio
          POSTGRES_DB: skillio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillio -d skillio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://skillio:skillio@localhost:5432/skillio_dev_unused
      TEST_DATABASE_URL: postgresql://skillio:skillio@localhost:5432/skillio_test
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      COOKIE_SECURE: "false"
      FRONTEND_URL: http://localhost:3000
      PASSWORD_RESET_EXPIRE_MINUTES: "15"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        run: python -m pytest -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
